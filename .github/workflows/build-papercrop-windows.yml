name: Build PaperCrop CLI for Windows
on:
  push:
    branches: [main]
    paths:
      - "papercrop-native-source.zip"
      - ".github/workflows/build-papercrop-windows.yml"
      - "extensions/**"
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract C++ sources
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'papercrop-native-source.zip' -DestinationPath . -Force
          if (!(Test-Path 'native/source/crop.hpp')) { throw 'Source archive is invalid' }
          if (!(Test-Path 'native/source/papercrop_cli.cpp')) { throw 'CLI source missing' }

      - name: Enable A3-split C++ extension
        shell: pwsh
        run: |
          Move-Item -Path 'native/source/papercrop_cli.cpp' -Destination 'native/source/papercrop_cli_legacy.cpp' -Force
          Copy-Item -Path 'extensions/papercrop_cli.cpp' -Destination 'native/source/papercrop_cli.cpp' -Force
          Copy-Item -Path 'extensions/robust_detector.hpp' -Destination 'native/source/robust_detector.hpp' -Force
          if (!(Test-Path 'native/source/papercrop_cli_legacy.cpp')) { throw 'Legacy source missing' }

      - name: Download official OpenCV 4.9 Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-windows.exe'
          $archive = Join-Path $env:RUNNER_TEMP 'opencv-4.9.0.exe'
          $unpack = Join-Path $env:RUNNER_TEMP 'opencv-pack'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10
          if (!(Test-Path $archive) -or (Get-Item $archive).Length -lt 100MB) { throw 'OpenCV download incomplete' }
          New-Item -ItemType Directory -Path $unpack -Force | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (!(Test-Path $sevenZip)) { throw '7-Zip is not installed on the runner' }
          & $sevenZip x $archive "-o$unpack" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV extraction failed' }
          $config = Get-ChildItem -Path $unpack -Filter 'OpenCVConfig.cmake' -File -Recurse | Select-Object -First 1
          if (!$config) { throw 'OpenCVConfig.cmake missing after extraction' }
          $dll = Get-ChildItem -Path $unpack -Filter 'opencv_world490.dll' -File -Recurse | Select-Object -First 1
          if (!$dll) { throw 'opencv_world490.dll missing after extraction' }
          $libConfig = Join-Path $dll.Directory.Parent.FullName 'lib/OpenCVConfig.cmake'
          if (!(Test-Path $libConfig)) { throw "Version-specific OpenCVConfig.cmake missing: $libConfig" }
          "OPENCV_CONFIG_DIR=$(Split-Path $libConfig -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENCV_DLL_DIR=$($dll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dll.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake (Visual Studio 2022 x64)
        shell: pwsh
        run: |
          cmake -S native -B native/build -G 'Visual Studio 17 2022' -A x64 "-DOpenCV_DIR=$env:OPENCV_CONFIG_DIR" -DPAPERCROP_BUILD_TESTS=OFF "-DCMAKE_CXX_FLAGS=/DNOMINMAX"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Compile C++ Release executable
        shell: pwsh
        run: |
          cmake --build native/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native C++ compile failed' }

      - name: Smoke test crop, resize, and combine
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(1200, 1000)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Black)
          $g.FillRectangle([System.Drawing.Brushes]::White, 200, 150, 800, 700)
          $g.Dispose()
          $scan = Join-Path $env:RUNNER_TEMP 'scan.bmp'
          $crop = Join-Path $env:RUNNER_TEMP 'crop.png'
          $resized = Join-Path $env:RUNNER_TEMP 'resized.png'
          $combined = Join-Path $env:RUNNER_TEMP 'combined.png'
          $bmp.Save($scan, [System.Drawing.Imaging.ImageFormat]::Bmp)
          $bmp.Dispose()
          $exe = 'native/bin/Release/papercrop_cli.exe'
          & $exe crop --input $scan --output $crop --width 0 --height 0 --perspective 0
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $crop)) { throw 'Crop test failed' }
          & $exe resize --input $crop --output $resized --max-width 595 --max-height 842
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $resized)) { throw 'Resize test failed' }
          & $exe combine --input $resized --second $resized --output $combined
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $combined)) { throw 'Combine test failed' }

      - name: Smoke test landscape A3 split with FOUR separate right-side photos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(4960, 3508)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Black)
          # Left A4 is resized as-is; FOUR photos at different positions on right A4.
          $g.FillRectangle([System.Drawing.Brushes]::White, 2740, 400, 420, 600)
          $g.FillRectangle([System.Drawing.Brushes]::White, 3520, 500, 450, 650)
          $g.FillRectangle([System.Drawing.Brushes]::White, 2890, 1930, 430, 610)
          $g.FillRectangle([System.Drawing.Brushes]::White, 3980, 2250, 470, 650)
          $g.Dispose()
          $input = Join-Path $env:RUNNER_TEMP 'a3_test.bmp'
          $output = Join-Path $env:RUNNER_TEMP 'a3_left.png'
          $bmp.Save($input, [System.Drawing.Imaging.ImageFormat]::Bmp)
          $bmp.Dispose()
          & 'native/bin/Release/papercrop_cli.exe' crop --input $input --output $output --a3-mode auto --max-width 595 --max-height 842
          if ($LASTEXITCODE -ne 0) { throw 'A3 split command failed' }
          if (!(Test-Path $output)) { throw 'Left half not saved' }
          $right = @(Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'a3_left_right_*.png')
          if ($right.Count -ne 4) { throw "Expected exactly 4 right crops, found $($right.Count)" }
          $leftImg = [System.Drawing.Image]::FromFile($output)
          if ($leftImg.Width -ne 595 -or $leftImg.Height -ne 842) {
            throw "Left resize incorrect: $($leftImg.Width)x$($leftImg.Height)"
          }
          $leftImg.Dispose()
          foreach ($f in $right) {
            $img = [System.Drawing.Image]::FromFile($f.FullName)
            if ($img.Width -gt 595 -or $img.Height -gt 842) { throw "Right crop too large: $($f.Name)" }
            $img.Dispose()
          }

      - name: Regression test actual-like 200 DPI A4 photo and A3 split
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $exe = 'native/bin/Release/papercrop_cli.exe'

          # Dark A4 scanning bed, small portrait and bright scanner-frame edge.
          $a4 = New-Object System.Drawing.Bitmap(1646, 2331)
          $a4.SetResolution(200, 200)
          $g = [System.Drawing.Graphics]::FromImage($a4)
          $g.Clear([System.Drawing.Color]::FromArgb(12,12,12))
          $g.FillRectangle([System.Drawing.Brushes]::White, 200, 140, 245, 335)
          $g.FillRectangle([System.Drawing.Brushes]::DarkBlue, 220, 190, 205, 255)
          $g.FillRectangle([System.Drawing.Brushes]::White, 0, 0, 4, 2331)
          $g.Dispose()
          $a4input = Join-Path $env:RUNNER_TEMP 'production_like_a4.jpg'
          $a4out = Join-Path $env:RUNNER_TEMP 'production_like_a4_crop.png'
          $a4.Save($a4input, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $a4.Dispose()
          & $exe crop --input $a4input --output $a4out --a3-mode auto --max-width 595 --max-height 842
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $a4out)) { throw 'Photo recovery failed' }
          $photo = [System.Drawing.Image]::FromFile($a4out)
          if ($photo.Width -gt 420 -or $photo.Height -gt 490 -or $photo.Width -lt 170 -or $photo.Height -lt 200) {
            throw "Unexpected dark A4 crop: $($photo.Width)x$($photo.Height)"
          }
          $photo.Dispose()

          # Same scanner metadata (200 dpi) but A3 paper: 3296x2331 pixels.
          $a3 = New-Object System.Drawing.Bitmap(3296, 2331)
          $a3.SetResolution(200,200)
          $g = [System.Drawing.Graphics]::FromImage($a3)
          $g.Clear([System.Drawing.Color]::Black)
          $g.FillRectangle([System.Drawing.Brushes]::White, 1940, 300, 260, 365)
          $g.FillRectangle([System.Drawing.Brushes]::White, 2530, 1440, 280, 360)
          $g.Dispose()
          $a3input = Join-Path $env:RUNNER_TEMP 'production_like_a3.jpg'
          $a3out = Join-Path $env:RUNNER_TEMP 'production_like_a3_left.png'
          $a3.Save($a3input, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $a3.Dispose()
          & $exe crop --input $a3input --output $a3out --a3-mode auto --max-width 595 --max-height 842
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $a3out)) { throw '200DPI A3 split failed' }
          $pieces = @(Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'production_like_a3_left_right_*.png')
          if ($pieces.Count -ne 2) { throw "Expected 2 right-side pieces for 200DPI A3, got $($pieces.Count)" }

      - name: Package EXE, OpenCV DLLs and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'release/native/bin'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item 'native/bin/Release/papercrop_cli.exe' -Destination $dest
          Copy-Item (Join-Path $env:OPENCV_DLL_DIR '*.dll') -Destination $dest
          Copy-Item 'native/LICENSE_PaperCrop.txt' -Destination 'release/native'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/opencv/opencv/4.9.0/LICENSE' -OutFile 'release/native/OpenCV-LICENSE.txt'
          if (!(Test-Path "$dest/papercrop_cli.exe")) { throw 'EXE missing from package' }

      - name: Upload downloadable Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: PaperCrop-CLI-Windows-x64
          path: release/**
          retention-days: 30
          if-no-files-found: error
